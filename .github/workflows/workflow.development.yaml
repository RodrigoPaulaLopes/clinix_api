name: "Development Workflow"


on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  development_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: yarn install

      - name: Run tests
        run: yarn test

      - name: Build application
        run: yarn build

      